name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build Test Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tests
          load: true
          tags: weave-playwright-tests:ci
          cache-from: type=gha,scope=weave-test-image
          cache-to: type=gha,scope=weave-test-image,mode=max,ignore-error=true

      - name: Save Test Image
        run: docker image save weave-playwright-tests:ci | gzip -1 > test-image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: test-image
          path: test-image.tar.gz
          archive: false
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: test-image
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Compile release scripts
        env:
          PACKAGE_SPECS: Check.Package@1.0.0
          WAIT_MINUTES: '1'
          POLL_SECONDS: '1'
        run: |
          dotnet fsi --exec build/DocsPackageVersions.fsx
          dotnet fsi --exec .github/actions/wait-for-nuget-packages/WaitForNuGet.fsx --check

      - uses: actions/download-artifact@v8
        with:
          name: test-image.tar.gz

      - name: Load Test Image
        run: docker image load --input test-image.tar.gz

      - name: Check Format
        run: docker compose run --rm playwright-tests sh -c "./build.sh CheckFormat"

      - name: Run unit and rendering tests
        run: docker compose run --rm playwright-tests sh -c "./build.sh RunUnitRenderingTests"

  docs-highlighting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Run docs highlighting tests
        run: yarn test:docs:highlighting

  browser-tests:
    runs-on: ubuntu-latest
    needs: test-image
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: test-image.tar.gz
      - name: Load Test Image
        run: docker image load --input test-image.tar.gz
      - name: Run browser suite
        run: docker compose run --rm -e WEAVE_E2E_BROWSER=${{ matrix.browser }} playwright-tests sh -c "./build.sh RunBrowserTests"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, browser-tests, docs-highlighting-tests]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Tools
        run: dotnet tool restore

      - name: Read documented package versions
        id: documented-packages
        run: dotnet fsi build/DocsPackageVersions.fsx

      - name: Wait for documented packages on NuGet
        uses: ./.github/actions/wait-for-nuget-packages
        with:
          packages: |
            Weave.WebSharper@${{ steps.documented-packages.outputs.library }}
            Weave.WebSharper.Templates@${{ steps.documented-packages.outputs.templates }}
          timeout-minutes: '45'

      - name: Build Pipeline
        run: ./build.sh BuildDocs

      - name: Check current main commit
        id: current_main
        run: |
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$current_sha"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale Pages deployment: $GITHUB_SHA is no longer main ($current_sha)"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.current_main.outputs.current == 'true'
        with:
          path: src/Weave.Docs/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current_main.outputs.current == 'true'
        uses: actions/deploy-pages@v4
