name: Load test image
description: Restore the shared test image cache and load it into Docker
runs:
  using: composite
  steps:
    - name: Restore test image cache
      uses: actions/cache@v5
      with:
        path: test-image.tar.gz
        # Keep this in sync with build-test-image/action.yml.
        key: weave-test-image-v1-${{ hashFiles('Dockerfile.tests', 'package.json') }}

    - name: Load test image
      shell: bash
      run: docker image load --input test-image.tar.gz
