name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet paket restore
      - name: Validate tag and release notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          dotnet run --project build/Weave.Build.fsproj -c Release -- -t ReleaseNotes
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          if [[ -f build/DocsPackageVersions.fsx ]]; then
            dotnet fsi --exec build/DocsPackageVersions.fsx --verify-library "$RELEASE_TAG"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  docs-highlighting-tests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Run docs highlighting tests
        run: yarn test:docs:highlighting

  test-image:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Restore test image cache
        id: test-image-cache
        uses: actions/cache@v4
        with:
          path: test-image.tar.gz
          # Bump the v1 prefix when intentionally refreshing upstream tool versions.
          key: weave-test-image-v1-${{ hashFiles('Dockerfile.tests', 'package.json') }}

      - uses: docker/setup-buildx-action@v4
        if: steps.test-image-cache.outputs.cache-hit != 'true'

      - name: Build test image
        if: steps.test-image-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tests
          load: true
          tags: weave-playwright-tests:ci
          cache-from: type=gha,scope=weave-test-image
          cache-to: type=gha,scope=weave-test-image,mode=max,ignore-error=true

      - name: Save test image
        if: steps.test-image-cache.outputs.cache-hit != 'true'
        run: docker image save weave-playwright-tests:ci | gzip -1 > test-image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: test-image
          path: test-image.tar.gz
          archive: false
          retention-days: 1

  non-browser-tests:
    runs-on: ubuntu-latest
    needs: [validate, test-image]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: test-image.tar.gz
      - name: Load test image
        run: docker image load --input test-image.tar.gz
      - name: Check format and run unit and rendering tests
        run: |
          docker compose run --rm playwright-tests sh -c "./build.sh CheckFormat"
          docker compose run --rm playwright-tests sh -c "./build.sh RunUnitRenderingTests"

  browser-tests:
    runs-on: ubuntu-latest
    needs: [validate, test-image]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: test-image.tar.gz
      - name: Load test image
        run: docker image load --input test-image.tar.gz
      - run: docker compose run --rm -e WEAVE_E2E_BROWSER=${{ matrix.browser }} playwright-tests sh -c "./build.sh RunBrowserTests"

  publish:
    runs-on: ubuntu-latest
    needs: [validate, non-browser-tests, browser-tests, docs-highlighting-tests]
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: corepack enable
      - run: dotnet tool restore
      - run: dotnet paket restore
      - run: yarn install --immutable
      - name: Pack
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          dotnet run --project build/Weave.Build.fsproj -c Release -- -t ReleaseNotes
          dotnet pack src/Weave/Weave.fsproj -c Release -o artifacts/package -p:PackageVersion="${RELEASE_TAG#v}"
          dotnet run --project build/Weave.Build.fsproj -c Release -- -t VerifyReleasePackage
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 1eyewonder
      - name: Publish to NuGet
        env:
          NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_TOKEN" || { echo "NuGet login did not return an API key" >&2; exit 1; }
          dotnet nuget push artifacts/package/*.nupkg --api-key "$NUGET_TOKEN" --source https://api.nuget.org/v3/index.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-rc* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/package/*.nupkg --title "$RELEASE_TAG" --notes-file release-body.md "${flags[@]}"
