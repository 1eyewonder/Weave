<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs Fixture</title>
    <link rel="stylesheet" href="../../../src/Weave/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!-- Horizontal (top) tabs with 3 tabs, first active -->
    <div
      id="tabs-top"
      class="weave-tabs weave-tabs--top weave-tabs--text weave-tabs--primary"
      style="width: 600px;"
    >
      <div id="tabs-header-wrapper" class="weave-tabs__header-wrapper">
        <div id="tabs-header" class="weave-tabs__header">
          <button id="tab-0" class="weave-tabs__tab weave-tabs__tab--active">Tab 1</button>
          <button id="tab-1" class="weave-tabs__tab">Tab 2</button>
          <button id="tab-2" class="weave-tabs__tab">Tab 3</button>
          <div class="weave-tabs__indicator"></div>
        </div>
      </div>
      <div id="tabs-panels" class="weave-tabs__panels">
        <div id="panel-0" class="weave-tabs__panel">Panel 1 content</div>
        <!-- Panel visibility is toggled by JS at runtime; hidden here for layout realism -->
        <div id="panel-1" class="weave-tabs__panel" style="display: none;">Panel 2 content</div>
      </div>
    </div>

    <!-- Bottom position tabs (column-reverse puts header-wrapper at bottom visually) -->
    <div
      id="tabs-bottom"
      class="weave-tabs weave-tabs--bottom weave-tabs--text weave-tabs--primary"
      style="width: 600px; margin-top: 24px;"
    >
      <div id="tabs-bottom-header-wrapper" class="weave-tabs__header-wrapper">
        <div class="weave-tabs__header">
          <button class="weave-tabs__tab weave-tabs__tab--active">Bottom Tab 1</button>
          <button class="weave-tabs__tab">Bottom Tab 2</button>
          <div class="weave-tabs__indicator"></div>
        </div>
      </div>
      <div class="weave-tabs__panels">
        <div class="weave-tabs__panel">Bottom panel content</div>
      </div>
    </div>

    <!-- Vertical (start) tabs -->
    <div
      id="tabs-start"
      class="weave-tabs weave-tabs--start weave-tabs--text weave-tabs--primary"
      style="width: 600px; height: 200px; margin-top: 24px;"
    >
      <div id="tabs-start-header-wrapper" class="weave-tabs__header-wrapper">
        <div class="weave-tabs__header">
          <button class="weave-tabs__tab weave-tabs__tab--active">Start Tab 1</button>
          <button class="weave-tabs__tab">Start Tab 2</button>
          <div class="weave-tabs__indicator"></div>
        </div>
      </div>
      <div class="weave-tabs__panels">
        <div class="weave-tabs__panel">Start panel content</div>
      </div>
    </div>
    <!-- Filled trays size to their labels while panels keep the available width. -->
    <div id="tabs-filled" class="weave-tabs weave-tabs--top weave-tabs--filled weave-tabs--primary"
      style="width: min(600px, 100%); margin-top: 24px;">
      <div id="filled-tray" class="weave-tabs__header-wrapper">
        <div class="weave-tabs__header">
          <button id="filled-first" class="weave-tabs__tab weave-tabs__tab--active">One</button>
          <button id="filled-last" class="weave-tabs__tab">Two</button>
          <div class="weave-tabs__indicator"></div>
        </div>
      </div>
      <div id="filled-panels" class="weave-tabs__panels">
        <div class="weave-tabs__panel">A panel with room beyond its short labels.</div>
      </div>
    </div>
    <div id="tabs-filled-centered" class="weave-tabs weave-tabs--top weave-tabs--filled weave-tabs--centered weave-tabs--primary"
      style="width: min(600px, 100%); margin-top: 24px;">
      <div id="filled-centered-tray" class="weave-tabs__header-wrapper">
        <div class="weave-tabs__header">
          <button class="weave-tabs__tab weave-tabs__tab--active">One</button>
          <button class="weave-tabs__tab">Two</button>
          <div class="weave-tabs__indicator"></div>
        </div>
      </div>
      <div class="weave-tabs__panels"><div class="weave-tabs__panel">Centered panel</div></div>
    </div>
    <div id="tabs-filled-scroll" class="weave-tabs weave-tabs--bottom weave-tabs--filled weave-tabs--primary"
      style="width: 220px; max-width: 100%; margin-top: 24px;">
      <div id="filled-scroll-tray" class="weave-tabs__header-wrapper">
        <button id="filled-scroll-back" class="weave-tabs__scroll-btn" aria-label="Previous tabs">
          <span class="weave-tabs__scroll-icon">&#10094;</span>
        </button>
        <div id="filled-scroll-header" class="weave-tabs__header">
          <button class="weave-tabs__tab weave-tabs__tab--active">First long label</button>
          <button class="weave-tabs__tab">Second long label</button>
          <button class="weave-tabs__tab">Third long label</button>
          <div class="weave-tabs__indicator"></div>
        </div>
        <button id="filled-scroll-forward" class="weave-tabs__scroll-btn" aria-label="Next tabs">
          <span class="weave-tabs__scroll-icon">&#10095;</span>
        </button>
      </div>
      <div class="weave-tabs__panels"><div class="weave-tabs__panel">Scrollable panel</div></div>
    </div>
  </body>
</html>
